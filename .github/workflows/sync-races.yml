name: Sync New Races

on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-races
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync

      - name: Commit and push any new race data
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/races
            git commit -m "Auto-ingest new race data

          $(git diff --name-only --cached public/data/races | xargs -n1 dirname | sort -u)"
            git push
            echo "PUSHED=1" >> "$GITHUB_ENV"
          else
            echo "No new races found."
          fi

      # A push made with the default GITHUB_TOKEN doesn't trigger other
      # workflows' `on: push` (GitHub's loop-prevention), so deploy.yml would
      # never rebuild the site after new race data lands. Trigger it directly.
      - name: Trigger site deploy
        if: env.PUSHED == '1'
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ github.token }}
